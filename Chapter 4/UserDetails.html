<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>User Details</title>
    <script src="script.js" defer></script>
    <script>
        function validatePhoneNumber(input) {
            input.value = input.value.replace(/\D/g, '').slice(0, 10);
        }
    </script>
</head>
<body>
    <header>
        <h1>Welcome to User Details Page</h1>
        <nav>
            <ul>
                <li><a href="#user-registration">Register</a></li>
                <li><a href="#user-login">Login</a></li>
            </ul>
        </nav>
        <button class="theme-toggle-button" onclick="toggleTheme()">Toggle Theme</button>
    </header>
    <section id="user-registration">
        <h2>User Registration</h2>
        <form action="/submit-registration" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br><br>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>
            
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required oninput="validatePhoneNumber(this)"><br><br>

            <label for="password">Create Password:</label>
            <input type="password" id="password" name="password" required><br><br>
            <span id="password-strength">Password Strength: </span><br><br>
            
            <input type="submit" value="Register">
        </form>
    </section>
    <section id="user-login">
        <h2>User Login</h2>
        <form action="/submit-login" method="post">
            <label for="login-email">Email:</label>
            <input type="email" id="login-email" name="email" required><br><br>
            
            <label for="login-password">Password:</label>
            <input type="password" id="login-password" name="password" required><br><br>
            
            <input type="submit" value="Login">
        </form>
    </section>
    <footer>
        <p>&copy; 2023 User Details. All rights reserved.</p>
    </footer>
</body>
</html>
